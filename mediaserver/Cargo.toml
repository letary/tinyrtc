[package]
name = "tinyrtc-mediaserver"
version = "0.1.1"
edition = "2021"
publish = false
description = "The media server of tinyrtc: rooms (the server is a peer) and the blind relay of 1:1 calls"

# Its own workspace root and its own lock file: not a workspace with core.
[workspace]

[lib]
name = "tinyrtc_mediaserver"
path = "src/lib.rs"

[[bin]]
name = "tinyrtc-mediaserver"
path = "src/main.rs"

[dependencies]
# The profile (profile.rs) and the STUN parser (stun.rs); the tests' phones are its `Connection`.
tinyrtc = { path = "../core" }
str0m = { version = "0.26.0", default-features = false, features = ["rust-crypto"] }

# The private API (http.rs): HTTP/1.1 on a small tokio runtime of the server's own. No TLS: it
# listens on loopback by design.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# axum's own: its LengthLimitError tells a body over the limit from a broken one.
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The command line (main.rs). No colour, no terminal probing: its output is a container's log.
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
# The events (one line each); the binary writes them to stderr as plain text.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# The same patched RustCrypto backend core ships (core/vendor/README.md).
[patch.crates-io]
str0m-rust-crypto = { path = "../core/vendor/str0m-rust-crypto" }

# A server: speed over size. Panics unwind, so one connection's panic (str0m's or ours) is caught
# on the network thread and costs that connection, not every room and call on the machine.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
