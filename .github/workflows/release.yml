# A release = a tag vX.Y.Z on a commit whose core/Cargo.toml and mediaserver/Cargo.toml say X.Y.Z.
# It publishes, after the tests:
#
#   ghcr.io/<owner>/tinyrtc-mediaserver :X.Y.Z :X.Y :latest      the media server's image
#   a GitHub Release with
#     tinyrtc-android-X.Y.Z.aar            the Android library (Kotlin + libtinyrtc_jni.so, two ABIs)
#     TinyRTCCore-X.Y.Z.xcframework.zip    the core for iOS (devices + the arm64 simulator)
#     checksums.txt                        sha256 of both; the zip's is what SwiftPM's binaryTarget wants
#
# The Kotlin and Swift sources of the platform halves are the tag's android/ and apple/ folders.
# "Run workflow" by hand builds all of it and publishes nothing (the artifacts stay on the run).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version() { grep -m1 '^version = ' "$1" | cut -d'"' -f2; }
          core=$(version core/Cargo.toml)
          server=$(version mediaserver/Cargo.toml)
          echo "core $core, mediaserver $server, ref $GITHUB_REF"
          if [ "$core" != "$server" ]; then echo "::error::core is $core, mediaserver is $server"; exit 1; fi
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF_NAME" != "v$core" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, the manifests say $core"; exit 1
          fi
          echo "version=$core" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tinyrtc-mediaserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ env.PUBLISH != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mediaserver/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The two libraries are built while the tests run; `publish` waits for both and for the tests.
  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      # android/tinyrtc/build.gradle.kts names the same two.
      NDK: 27.0.12077973
      CMAKE: 3.22.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "cmake;$CMAKE" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"
      - name: toolchain
        run: rustup toolchain install --no-self-update
        working-directory: core
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: cargo install cargo-ndk --locked
      - name: core
        run: ./build-core.sh
        working-directory: android
      - name: library
        run: ./gradlew --no-daemon :tinyrtc:assembleRelease
        working-directory: android
      - name: package
        run: |
          mkdir out
          cp android/tinyrtc/build/outputs/aar/tinyrtc-release.aar "out/tinyrtc-android-${{ needs.version.outputs.version }}.aar"
          unzip -l out/*.aar
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  apple:
    needs: version
    # Xcode 26: an app links the core with an Xcode whose Swift is not older than the one that built
    # it (apple/build-core.sh), so the release is built with the older Xcode still in use.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: toolchain
        run: rustup toolchain install --no-self-update
        working-directory: core
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apple
      - name: core
        run: ./build-core.sh
        working-directory: apple
      - name: package
        run: |
          mkdir out
          ditto -c -k --sequesterRsrc --keepParent apple/TinyRTCCore.xcframework \
            "out/TinyRTCCore-${{ needs.version.outputs.version }}.xcframework.zip"
          cp apple/build/core/sizes.txt out/apple-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, test, image, android, apple]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By name: the image job leaves an artifact of its own (docker's build record), not a zip.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{android,apple}"
          path: out
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd out
          sha256sum *.aar *.zip > checksums.txt
          cat checksums.txt
          {
            echo "Media server image: \`ghcr.io/${{ github.repository_owner }}/tinyrtc-mediaserver:$VERSION\`"
            echo
            echo "iOS core, linked into an app (dead-stripped code + data):"
            echo '```'
            cat apple-sizes.txt
            echo '```'
          } > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" \
            --notes-file notes.md --generate-notes *.aar *.zip checksums.txt
